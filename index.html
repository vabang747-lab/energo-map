<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГИС Диспетчер — Свечение и Подсветка Объектов</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-glow: #00f2fe;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; }

        #map { height: 100vh; width: 100vw; z-index: 1; background: #080c14; }

        /* ==================== СТИЛИ И АНИМАЦИИ СВЕЧЕНИЯ ==================== */

        /* 1. Пульсирующий неоновый ореол для точечных объектов (ТП / Опоры) */
        @keyframes pulse-glow {
            0% {
                transform: scale(0.8);
                opacity: 0.9;
                box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.8), 0 0 20px 8px rgba(0, 242, 254, 0.6);
            }
            70% {
                transform: scale(1.4);
                opacity: 0;
                box-shadow: 0 0 0 25px rgba(0, 242, 254, 0), 0 0 35px 15px rgba(0, 242, 254, 0);
            }
            100% {
                transform: scale(0.8);
                opacity: 0;
            }
        }

        .glow-point-icon {
            background: transparent;
            border: none;
        }

        .glow-point-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glow-ring {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 242, 254, 0.4);
            animation: pulse-glow 2s infinite cubic-bezier(0.45, 0, 0.55, 1);
        }

        .glow-core {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-glow), 0 0 30px var(--accent-glow);
            z-index: 2;
        }

        /* 2. Свечение линий ЛЭП (SVG drop-shadow + анимация бегущих пунктиров) */
        @keyframes dash-flow {
            to { stroke-dashoffset: -20; }
        }

        .glow-line-back {
            stroke: var(--accent-glow) !important;
            stroke-opacity: 0.8 !important;
            filter: drop-shadow(0px 0px 8px var(--accent-glow)) drop-shadow(0px 0px 18px var(--accent-glow));
        }

        .glow-line-flow {
            stroke: #ffffff !important;
            stroke-dasharray: 6, 10;
            animation: dash-flow 1s linear infinite;
        }

        /* ==================== ИНТЕРФЕЙС И ПАНЕЛИ ==================== */

        .top-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            display: flex;
            gap: 12px;
        }

        .search-trigger {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 10px;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: all 0.25s ease;
        }

        .search-trigger:hover {
            border-color: var(--accent-glow);
            color: var(--text-main);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        .analytics-card {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 14px;
            width: 320px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            display: none; /* Показываем при клике */
        }

        .analytics-card h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-glow);
            margin-bottom: 12px;
        }

        .metric-group { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .metric-value { font-weight: 600; }

        .btn-reset {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }
        .btn-reset:hover { border-color: var(--accent-red); color: var(--accent-red); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="top-bar">
        <div class="search-trigger" onclick="alert('Для выбора кликните на ТП или ЛЭП на карте')">
            🔍 <span>Кликните на объект для активации свечения</span>
        </div>
    </div>

    <!-- Панель информации о подсвеченном объекте -->
    <div class="analytics-card" id="analyticsCard">
        <h4 id="objTitle">⚡ ОБЪЕКТ ВЫБРАН</h4>
        <div class="metric-group">
            <span style="color:var(--text-sub)">Тип / Дисп. имя:</span>
            <span class="metric-value" id="objType">ТП 10/0.4 кВ</span>
        </div>
        <div class="metric-group">
            <span style="color:var(--text-sub)">Нагрузка / Длина:</span>
            <span class="metric-value" id="objParam">180 кВА</span>
        </div>
        <div class="metric-group">
            <span style="color:var(--text-sub)">Состояние:</span>
            <span class="metric-value" style="color:var(--accent-green)" id="objStatus">● В норме</span>
        </div>
    </div>

    <button class="btn-reset" onclick="clearGlow()">✨ Сбросить подсветку</button>

    <script>
        // Инициализация карты
        const map = L.map('map', { zoomControl: false }).setView([44.1833, 66.7500], 15);

        // Картографическая подложка (Dark)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Переменные для хранения текущего свечения
        let activeGlowLayer = null;
        let activeGlowFlowLine = null;

        // Иконка пульсирующего неонового маркера
        const glowIcon = L.divIcon({
            className: 'glow-point-icon',
            html: `
                <div class="glow-point-container">
                    <div class="glow-ring"></div>
                    <div class="glow-core"></div>
                </div>
            `,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });

        // ==================== МАКЕТНЫЕ ДАННЫЕ СЕТИ ====================

        // 1. Точечные объекты (Трансформаторные подстанции)
        const tpObjects = [
            { id: 'TP1', name: 'ТП-102 Центр', lat: 44.1833, lng: 66.7500, power: '250 кВА' },
            { id: 'TP2', name: 'ТП-105 Север', lat: 44.1880, lng: 66.7580, power: '400 кВА' }
        ];

        // 2. Линейные объекты (ЛЭП 10 кВ)
        const lineCoords = [
            [44.1833, 66.7500],
            [44.1855, 66.7535],
            [44.1880, 66.7580]
        ];

        // Отрисовка базовой ЛЭП
        const basePolyline = L.polyline(lineCoords, {
            color: '#3b82f6',
            weight: 4,
            opacity: 0.7
        }).addTo(map);

        basePolyline.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            highlightLine(basePolyline, 'ЛЭП-10кВ Фидер №10', '1.25 км');
        });

        // Отрисовка базовых маркеров ТП
        tpObjects.forEach(tp => {
            const marker = L.circleMarker([tp.lat, tp.lng], {
                radius: 8,
                fillColor: '#3b82f6',
                color: '#ffffff',
                weight: 2,
                fillOpacity: 0.9
            }).addTo(map);

            marker.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                highlightPoint([tp.lat, tp.lng], tp.name, tp.power);
            });
        });

        // ==================== ФУНКЦИИ АКТИВАЦИИ СВЕЧЕНИЯ ====================

        // Подсветка точечного объекта (ТП / Опора)
        function highlightPoint(latlng, title, param) {
            clearGlow();

            // Создаем слой свечения поверх
            activeGlowLayer = L.marker(latlng, { icon: glowIcon, zIndexOffset: 1000 }).addTo(map);

            // Показываем инфо-панель
            showPanel(title, 'Трансформаторная подстанция', param);

            // Анимированный перелет камеры
            map.flyTo(latlng, 16, { duration: 1 });
        }

        // Подсветка линии (ЛЭП)
        function highlightLine(polyline, title, lengthStr) {
            clearGlow();

            const coords = polyline.getLatLngs();

            // 1. Нижний неоновый размытый слой
            activeGlowLayer = L.polyline(coords, {
                className: 'glow-line-back',
                weight: 10
            }).addTo(map);

            // 2. Верхний слой с «бегущим» пунктиром
            activeGlowFlowLine = L.polyline(coords, {
                className: 'glow-line-flow',
                weight: 4
            }).addTo(map);

            showPanel(title, 'Воздушная линия 10 кВ', lengthStr);
        }

        // Сброс свечения
        function clearGlow() {
            if (activeGlowLayer) {
                map.removeLayer(activeGlowLayer);
                activeGlowLayer = null;
            }
            if (activeGlowFlowLine) {
                map.removeLayer(activeGlowFlowLine);
                activeGlowFlowLine = null;
            }
            document.getElementById('analyticsCard').style.display = 'none';
        }

        function showPanel(title, type, param) {
            document.getElementById('objTitle').innerText = '⚡ ' + title;
            document.getElementById('objType').innerText = type;
            document.getElementById('objParam').innerText = param;
            document.getElementById('analyticsCard').style.display = 'block';
        }

        // Клик по свободной карте сбрасывает свечение
        map.on('click', () => {
            clearGlow();
        });
    </script>
</body>
</html>
