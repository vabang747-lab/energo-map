<script>
let DATA = [];
const DATA_URL = "./data_synchronized.geojson";
const layers = new Map();
const objects = new Map();

const map = L.map("map", {zoomControl: true, preferCanvas: true}).setView([44.18, 66.73], 14);
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 20, attribution: "© OpenStreetMap"});
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 20, attribution: "© Esri"});
const labels = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png", {maxZoom: 20, attribution: "© CARTO"});

osm.addTo(map);

L.control.layers(
  {"Стандартная схема": osm, "Спутник": esri, "Гибрид": L.layerGroup([esri, labels])},
  null,
  {collapsed: true, position: "topright"}
).addTo(map);

function objectIs04(o) {
  if (!o) return false;
  const t = String(o.type || o.object_type || "").toLowerCase();
  const v = String(o.voltage || "").toLowerCase();
  return t === "line04" || t === "input04" || (t.includes("line") && (v.includes("0.4") || v.includes("0,4")));
}

function getNodeRadius(o, zoom) {
  const z = zoom || map.getZoom();
  let base = 6;
  const t = String(o.type || o.object_type || "").toLowerCase();
  if (t === "substation") base = 11;
  else if (t === "rp") base = 10;
  else if (t === "tp" || t === "ktp" || t === "transformer") base = 8;
  
  if (z <= 11) return Math.max(3, base - 4.5);
  if (z === 12) return Math.max(3, base - 3.5);
  if (z === 13) return Math.max(4, base - 2);
  if (z === 14) return base;
  if (z === 15) return base + 2;
  return base + 4;
}

function styleForObject(o) {
  const is04 = objectIs04(o);
  if (is04) return {color: "#b57cff", weight: 3, opacity: 0.95, dashArray: "6 5"};
  
  const t = String(o.type || o.object_type || "").toLowerCase();
  switch (t) {
    case "substation": return {color: "#e34b4b", fillColor: "#e34b4b", radius: getNodeRadius(o), weight: 3};
    case "rp": return {color: "#ff7b45", fillColor: "#ff7b45", radius: getNodeRadius(o), weight: 3};
    case "tp":
    case "ktp":
    case "transformer": return {color: "#ffd34d", fillColor: "#ffd34d", radius: getNodeRadius(o), weight: 2};
    case "line110": return {color: "#ff3b30", weight: 6, opacity: .95};
    case "line35": return {color: "#ff9f43", weight: 5, opacity: .95};
    case "feeder":
    case "line10": return {color: "#36a8ff", weight: 5, opacity: .95};
    default: return {color: "#ffd34d", fillColor: "#ffd34d", radius: getNodeRadius(o), weight: 2};
  }
}

function makeFeatureLayer(o) {
  const g = o.geometry;
  const s = styleForObject(o);
  if (!g) return null;

  let layer;
  if (g.type === "Point") {
    layer = L.circleMarker([g.coordinates[1], g.coordinates[0]], {
      radius: s.radius, color: "#111", fillColor: s.fillColor || s.color, fillOpacity: 0.9, weight: 1.5
    });
  } else {
    layer = L.geoJSON(g, { style: () => s });
  }

  layer.on("click", e => { L.DomEvent.stopPropagation(e); selectObject(o.id); });
  layer.bindTooltip(o.name, { sticky: true, opacity: .95 });
  return layer;
}

async function loadGeoJSON() {
  const response = await fetch(DATA_URL, {cache: "no-store"});
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const geojson = await response.json();

  DATA = (geojson.features || []).map((feature, i) => {
    const p = feature.properties || {};
    return {
      ...p,
      id: String(p.id || `geo_${String(i).padStart(4, "0")}`),
      parent_id: p.parent_id ? String(p.parent_id) : null,
      name: p.name || `Объект ${i+1}`,
      type: p.object_type || p.type || (feature.geometry && feature.geometry.type ? feature.geometry.type.toLowerCase() : "point"),
      geometry: feature.geometry
    };
  });

  DATA.forEach(o => objects.set(o.id, o));
  renderGeoJSON();
  document.getElementById("statusText").textContent = `GeoJSON: ${DATA.length} объектов`;
}

// Отображаем ВСЕ объекты (включая ВЛ 0.4 кВ) сразу на карте
function renderGeoJSON() {
  DATA.forEach(o => {
    const layer = makeFeatureLayer(o);
    if (!layer) return;
    layers.set(o.id, layer);
    layer.addTo(map);
  });

  const allLayers = Array.from(layers.values());
  if (allLayers.length) {
    const group = L.featureGroup(allLayers);
    if (group.getBounds().isValid()) map.fitBounds(group.getBounds().pad(.05));
  }
}

function refreshAll() {
  DATA.forEach(o => {
    const l = layers.get(o.id);
    if (!l) return;

    const s = styleForObject(o);
    const isSelected = selectedId === o.id;

    if (l.setStyle) {
      l.setStyle({
        opacity: isSelected ? 1 : (selectedId ? 0.35 : 0.9),
        weight: isSelected ? (s.weight || 2) + 2 : s.weight
      });
      if (o.geometry && o.geometry.type === "Point" && l.setRadius) {
        l.setRadius(isSelected ? getNodeRadius(o) + 4 : getNodeRadius(o));
      }
    }
  });
}

function selectObject(id) {
  const o = objects.get(id);
  if (!o) return;

  selectedId = id;
  refreshAll();

  const layer = layers.get(id);
  if (layer) {
    const b = layer.getBounds ? layer.getBounds() : layer.getLatLng ? L.latLngBounds([layer.getLatLng()]) : null;
    if (b && b.isValid()) map.fitBounds(b.pad(.6), {maxZoom: 17});
  }

  showCard(o);
  document.getElementById("focusNote").style.display = "block";
  document.getElementById("focusNote").textContent = "ФОКУС: " + o.name;
}

function resetSelection() {
  selectedId = null;
  refreshAll();
  document.getElementById("focusNote").style.display = "none";
  clearCard();
}

map.on("click", resetSelection);
document.getElementById("closePanel").onclick = resetSelection;

function showCard(o) {
  document.getElementById("objectTitle").textContent = o.name;
  document.getElementById("objectSubtitle").textContent = (o.object_type || o.type || "ОБЪЕКТ").toUpperCase();
  
  const parent = o.parent_id ? objects.get(o.parent_id) : null;
  const rows = [
    ["ID", o.id],
    ["Тип объекта", o.object_type || o.type || "—"],
    ["Напряжение", o.voltage || "—"],
    ["Запитано от", parent ? parent.name : (o.fed_from || "—")],
    ["Установленная мощность", o.power_kva ? o.power_kva + " кВА" : "—"],
    ["Описание", o.description || "—"]
  ];
  document.getElementById("attrs").innerHTML = rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("");
}

function clearCard() {
  document.getElementById("objectTitle").textContent = "Объект не выбран";
  document.getElementById("objectSubtitle").textContent = "Кликните объект на карте";
  document.getElementById("attrs").innerHTML = '<tr><td>Состояние</td><td>Ожидание выбора</td></tr>';
}

function esc(v) { return String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }

loadGeoJSON();
</script>
