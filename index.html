<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПТО Энергоучёт | Геопортал РЭС</title>
  
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: JetBrains Mono & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0e14;
      --panel-bg: rgba(16, 23, 34, 0.75);
      --panel-border: rgba(0, 240, 255, 0.2);
      --accent-cyan: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.4);
      --accent-amber: #ffaa00;
      --text-main: #e0e6ed;
      --text-muted: #8a99ad;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* MAP CONTAINER */
    #map {
      flex: 1;
      height: 100%;
      background: #070a0f;
      z-index: 1;
    }

    /* HEADER OVERLAY */
    .header-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 12px 20px;
      border-radius: var(--radius);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), 0 0 10px var(--accent-glow);
      pointer-events: auto;
    }

    .header-overlay h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }

    .header-overlay h1::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
      animation: pulse 2s infinite;
    }

    .header-overlay p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    /* RIGHT DATA PANEL CARD */
    .data-panel {
      width: 420px;
      height: calc(100vh - 32px);
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 240, 255, 0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      overflow: hidden;
    }

    .data-panel.hidden {
      transform: translateX(450px);
      opacity: 0;
      pointer-events: none;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .panel-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: block;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .panel-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .panel-close:hover {
      color: var(--accent-cyan);
    }

    .panel-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: flex-start;
      flex-direction: column;
      gap: 16px;
    }

    /* DATA GRID FIELDS */
    .field-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.3s;
    }

    .field-group:hover {
      border-color: rgba(0, 240, 255, 0.3);
    }

    .field-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
    }

    .field-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      word-break: break-word;
      white-space: pre-line;
    }

    .field-value.highlight {
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    /* BUTTONS / LINKS */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--accent-cyan);
      border-radius: 6px;
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
    }

    .btn-link:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 20px var(--accent-cyan);
      transform: translateY(-2px);
    }

    /* CUSTOM GLOW MAP ELEMENTS */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--panel-bg) !important;
      color: var(--text-main) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    /* ANIMATIONS */
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(0, 240, 255, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(0, 240, 255, 0);
      }
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--panel-border);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-cyan);
    }
  </style>
</head>
<body>

<div id="app">
  <!-- TOP LEFT TITLE OVERLAY -->
  <div class="header-overlay">
    <h1>ПТО Инженер / Карта Энергосетей</h1>
    <p>Мониторинг ПС, КТП и Электроустановок</p>
  </div>

  <!-- LEAFLET MAP -->
  <div id="map"></div>

  <!-- RIGHT SIDEBAR DATA CARD -->
  <div id="dataCard" class="data-panel hidden">
    <div class="panel-header">
      <span id="objType" class="panel-tag">Тип объекта</span>
      <h2 id="objName" class="panel-title">Наименование объекта</h2>
      <button class="panel-close" onclick="closePanel()">&times;</button>
    </div>
    
    <div class="panel-body">
      <div class="field-group">
        <div class="field-label">Идентификатор (ID)</div>
        <div id="objId" class="field-value highlight">-</div>
      </div>

      <div class="field-group">
        <div class="field-label">Класс напряжения / Мощность</div>
        <div id="objVoltage" class="field-value">-</div>
      </div>

      <div class="field-group">
        <div class="field-label">Дата ввода / Год</div>
        <div id="objYear" class="field-value">-</div>
      </div>

      <div class="field-group">
        <div class="field-label">Питается от (Федер / Источник)</div>
        <div id="objFedFrom" class="field-value">-</div>
      </div>

      <div class="field-group">
        <div class="field-label">Техническое описание / Параметры</div>
        <div id="objDesc" class="field-value">-</div>
      </div>

      <div class="field-group" id="linksGroup">
        <div class="field-label">Документация и схемы</div>
        <div id="objLinks" class="links-container">
          <!-- ссылки вставятся динамически -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // GeoJSON данные напрямую из предоставленного файла
  const geojsonData = {"type": "FeatureCollection", "features": [{"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[66.7200739, 44.1880497], [66.7199613, 44.188019], [66.7199371, 44.1880613], [66.7198325, 44.1880305], [66.7198567, 44.1879901], [66.7195375, 44.1878882], [66.7194597, 44.1880151], [66.7187355, 44.1878016], [66.7191378, 44.1871419], [66.7203824, 44.187517], [66.7200739, 44.1880497]]]}, "properties": {"id": "substation_0001", "name": "\"Шиели\" ПС 220/110/35/10 кВ", "object_type": "substation", "voltage": "220/110/35/10 кВ", "parent_id": null, "fed_from": null, "year": "07.10.1994", "power_kva": null, "balance": null, "inventory_no": null, "length": null, "description": "Дата ввода в эксплуатацию: 07.10.1994\nТ-1 мощность: 40 000 кВА\nТ-2 мощность: 16 000 кВА\nТип устр.РЗА: 7SJ825, 7SJ8042, 7SJ85, 7UT82, 7UT86", "links": [{"name": "Гео-схема", "url": "https://www.google.com/maps/d/viewer?hl=ru&mid=1UqN86d6VyzQL0MXQDKVtVRaLhrjvZd4&ll=44.17740384068313%2C66.71204850000001&z=15"}, {"name": "ТБ", "url": "https://tbkrekshieli.taplink.kz"}, {"name": "Версия 2.0", "url": "https://vabang747-lab.github.io/energo-map/"}, {"name": "Фото", "url": "https://mymaps.usercontent.google.com/hostedimage/m/*/3AAjQbR4wumQF_RPFFaAuG_QEr13tu3UhFogvFPet6ypFar3YhK1o4wxfKN1vCUGJqWYW0s3nqdIg4-C4bUcTFO4unlQ_waD9HG-QB1FMukr45ULLjhvWV-UnL6ztALrKofG0_M3lX_DIkxcElx4Wm0sZq8XcJ0u3qYt7vrOIIw2yS4-y0QdbMAmxuZucjX-WP1kfNWRKzEeAYD6UE8uZFCSlbFhswYzkqFFGGXX8Ty0PzW7CukhV4HgIZX1hhs0?authuser=0&fife=s16383"}], "source_folder": "Электроустановки"}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[66.7392481, 44.1657996], [66.7390926, 44.1657775], [66.7391207, 44.1656909], [66.7392683, 44.165713], [66.7392481, 44.1657996]]]}, "properties": {"id": "substation_0002", "name": "\"ЦРП-10 кВ\" ПС", "object_type": "substation", "voltage": null, "parent_id": null, "fed_from": null, "year": "04.08.1982", "power_kva": null, "balance": null, "inventory_no": null, "length": null, "description": "Дата ввода в эксплуатацию: 04.08.1982", "links": [{"name": "Гео-схема", "url": "https://www.google.com/maps/d/u/0/viewer?hl=ru&mid=1ZiT75tuaCmxam5m6lNwi0OUH2rbWMyA&ll=44.161923076224305%2C66.73364400000001&z=17"}, {"name": "Однолинейная схема", "url": "https://miro.com/app/board/uXjVHVvZ-uQ=/?moveToWidget=3458764672747890157&cot=14"}, {"name": "Анимация", "url": "https://canva.link/sf1ipihpeiuxp3o"}, {"name": "Фото", "url": "https://mymaps.usercontent.google.com/hostedimage/m/*/3AAjQbR47NyxLBwq7vYq2O4ngfYr8cCUZzXiJmDfUHBrlQd3reeCrieM1e_zPyHaMaVhKKVh_QN-FZK3QVd6F3nMsKthunHAqUzdcpLpYj4eYTIUizPcRPqCZ_cLx8E0col_h9zICKBR5sumPu1gtW1FtyS1FOwTq-PrD9J9smISgvWKTQknPz3av8HAQM95zwJ44Z16TmS7RJLoYT-3tYDQFAqZvZ576slWEE9M2n_YKAq66o_2eLLYGhpRAG3g?authuser=0&fife=s16383"}], "source_folder": "Электроустановки"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [66.7579496, 44.1598957]}, "properties": {"id": "tp_0001", "name": "610 КТПН-10/0,4 кВ", "object_type": "tp", "voltage": "10/0,4 кВ", "parent_id": "feeder_0040", "fed_from": "ф.Шыгыс-3", "year": null, "power_kva": null, "balance": null, "inventory_no": null, "length": null, "description": null, "links": [{"name": "Фото 1", "url": "https://mymaps.usercontent.google.com/hostedimage/m/*/3AAjQbR4Cy6ezZLIhJ2S3g1F61BV6mMc2jzAYlVcsTDDa0klKGvsoChbDM-_cMQtKXeV-4Ywb0wGIoD3ix74DDm2k2dSIC-A1wScmQMzSg9VGU81h5oSwv3sbo7sFLWaY2QT9bTJWsPhZR_ATBrNkdy7NsRtfCWy_lSgiiuZxpZ8SirXS3tXyPXlsVQKIjFAdyRCfJsbNi4ruI6eJBziQKo9JqgJ6wSntDGBG_ukO-FuReRPn7hcFUVVZS2X_M8M?authuser=0&fife=s16383"}], "source_folder": "Трансформаторные пункты"}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [66.7283119, 44.1627517]}, "properties": {"id": "tp_0021", "name": "82 КТПН-10/0,4 кВ", "object_type": "tp", "voltage": "10/0,4 кВ", "parent_id": "feeder_0034", "fed_from": "ф.Советский", "year": null, "power_kva": "400 кВА", "balance": null, "inventory_no": null, "length": null, "description": null, "links": [{"name": "Паспорт", "url": "https://docs.google.com/document/d/1zj5R9i-DyGRqS0G7sTyHnOGzT77ieXS5/edit?usp=sharing"}], "source_folder": "Трансформаторные пункты"}}
  ]};

  // 1. Инициализация темной карты CartoDB Dark Matter
  const map = L.map('map', {
    zoomControl: false
  }).setView([44.1800, 66.7300], 13);

  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // 2. Стилизация объектов под неоновый Glow-эффект
  const substationStyle = {
    color: '#00f0ff',
    weight: 2,
    opacity: 0.9,
    fillColor: '#00f0ff',
    fillOpacity: 0.25
  };

  // Функция отображения карточки
  function openPanel(props) {
    const card = document.getElementById('dataCard');
    
    document.getElementById('objType').innerText = props.object_type ? props.object_type.toUpperCase() : 'ОБЪЕКТ';
    document.getElementById('objName').innerText = props.name || 'Без названия';
    document.getElementById('objId').innerText = props.id || '-';
    document.getElementById('objVoltage').innerText = props.voltage || props.power_kva || 'Н/Д';
    document.getElementById('objYear').innerText = props.year || 'Н/Д';
    document.getElementById('objFedFrom').innerText = props.fed_from || 'Н/Д';
    document.getElementById('objDesc').innerText = props.description || 'Описание отсутствует';

    // Рендер ссылок
    const linksContainer = document.getElementById('objLinks');
    linksContainer.innerHTML = '';
    
    if (props.links && props.links.length > 0) {
      document.getElementById('linksGroup').style.display = 'block';
      props.links.forEach(link => {
        const a = document.createElement('a');
        a.className = 'btn-link';
        a.href = link.url;
        a.target = '_blank';
        a.innerHTML = `<span>${link.name}</span> <span>&#8599;</span>`;
        linksContainer.appendChild(a);
      });
    } else {
      document.getElementById('linksGroup').style.display = 'none';
    }

    card.classList.remove('hidden');
  }

  function closePanel() {
    document.getElementById('dataCard').classList.add('hidden');
  }

  // 3. Добавление GeoJSON на карту с интерактивностью
  const geoLayer = L.geoJSON(geojsonData, {
    style: function(feature) {
      return substationStyle;
    },
    pointToLayer: function(feature, latlng) {
      // Иконка точки с эффектом пульсирующего неонового свечения
      const customIcon = L.divIcon({
        className: 'custom-glow-pin',
        html: `<div style="
          width: 14px; 
          height: 14px; 
          background: #ffaa00; 
          border-radius: 50%; 
          box-shadow: 0 0 10px #ffaa00, 0 0 20px #ffaa00; 
          border: 2px solid #fff;"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      return L.marker(latlng, { icon: customIcon });
    },
    onEachFeature: function(feature, layer) {
      layer.on('click', function(e) {
        openPanel(feature.properties);
        
        // Подсветка полигона при клике
        if (layer.setStyle) {
          geoLayer.resetStyle();
          layer.setStyle({
            color: '#ffaa00',
            fillColor: '#ffaa00',
            fillOpacity: 0.5
          });
        }
      });
    }
  }).addTo(map);

  // Масштабирование карты под объекты
  if (geoLayer.getBounds().isValid()) {
    map.fitBounds(geoLayer.getBounds(), { padding: [50, 50] });
  }
</script>
</body>
</html>
