<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Энергоузел Шиели — Диспетчерская ГИС</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<style>
:root{
  --bg:#171b20;--panel:#20262d;--panel2:#293139;--border:#3b444e;
  --text:#edf1f4;--muted:#9ca7b2;--accent:#39a9ff;--green:#48d597;
}
*{box-sizing:border-box}
html,body,#map{width:100%;height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:#171b20;color:var(--text);overflow:hidden}
#map{position:absolute;inset:0}

/* Карта / Leaflet */
.leaflet-control-layers{
  background:rgba(28,34,40,.97)!important;color:#edf1f4!important;
  border:1px solid #3b444e!important;border-radius:6px!important;
  box-shadow:0 4px 16px rgba(0,0,0,.35)!important;
}
.leaflet-control-layers-expanded{padding:8px 10px}
.leaflet-control-layers label{margin:5px 0;font-size:12px}
.leaflet-control-zoom a{
  background:#20262d!important;color:#edf1f4!important;border-color:#3b444e!important
}
.leaflet-control-attribution{background:rgba(20,24,28,.85)!important;color:#aeb8c2}
.leaflet-control-attribution a{color:#7fc7ff}

/* Порядок слоёв: линии снизу, ТП сверху */
.leaflet-pane.energy-lines-pane{z-index:410}
.leaflet-pane.energy-line04-pane{z-index:405}
.leaflet-pane.energy-nodes-pane{z-index:620}
.leaflet-pane.energy-tp-pane{z-index:650}
.leaflet-pane.energy-label-pane{z-index:700}

/* Верхняя панель */
.topbar{
  position:absolute;z-index:1000;left:14px;right:430px;top:14px;height:52px;
  display:flex;align-items:center;padding:8px 13px;
  background:rgba(25,30,35,.95);border:1px solid var(--border);border-radius:7px;
  box-shadow:0 4px 18px rgba(0,0,0,.28);pointer-events:none
}
.brand{font-size:15px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;color:#aab4be;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}

/* Поиск */
.search{
  position:absolute;z-index:1001;left:14px;top:78px;width:330px;
  background:rgba(25,30,35,.96);border:1px solid var(--border);border-radius:7px;
  padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.3)
}
.search input{
  width:100%;height:36px;background:#15191e;border:1px solid #3b444e;
  color:#fff;padding:0 10px;border-radius:5px;outline:none
}
.search input:focus{border-color:#4e9ed0}
.results{max-height:300px;overflow:auto;margin-top:6px}
.result{padding:8px;border-radius:4px;cursor:pointer;font-size:12px}
.result:hover{background:#303942}
.result small{color:#7f8a95}

/* Панель объекта */
.sidebar{
  position:absolute;z-index:1100;top:0;right:0;width:410px;height:100%;
  background:rgba(27,32,38,.97);border-left:1px solid var(--border);
  box-shadow:-6px 0 22px rgba(0,0,0,.3);display:flex;flex-direction:column
}
.sidebar-head{padding:16px 18px 13px;border-bottom:1px solid var(--border)}
.kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700}
.title{font-size:17px;font-weight:700;line-height:1.25;margin-top:5px}
.subtitle{font-size:11px;color:var(--muted);margin-top:5px}
.close{float:right;border:0;background:none;color:#9da8b2;font-size:21px;cursor:pointer}
.sidebar-body{padding:14px 16px;overflow:auto}
.section{margin-bottom:18px}
.section h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#b8c1ca;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:7px 6px;border-bottom:1px solid #333b43;vertical-align:top}
td:first-child{width:44%;color:var(--muted)}
td:last-child{font-weight:600;color:#f1f4f7;overflow-wrap:anywhere}
.link-list{display:flex;flex-direction:column;gap:7px}
.link-btn{
  display:flex;gap:8px;align-items:center;text-decoration:none;color:#dfeeff;
  background:#29333c;border:1px solid #3d4a55;border-radius:5px;padding:8px 10px;
  font-size:12px;overflow-wrap:anywhere
}
.link-btn:hover{background:#33414c;border-color:#5b6c79}

/* Фокус */
.focus-note{
  position:absolute;z-index:1000;right:425px;top:78px;display:none;
  background:rgba(25,30,35,.95);border:1px solid var(--border);border-radius:5px;
  padding:8px 10px;color:#cbd3db;font-size:11px;max-width:300px
}

/* Легенда */
.legend{
  position:absolute;z-index:1000;left:14px;bottom:18px;
  background:rgba(25,30,35,.95);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;font-size:11px;box-shadow:0 4px 16px rgba(0,0,0,.25)
}
.legend-title{font-weight:700;margin-bottom:6px}
.legend-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.sw{width:28px;height:4px;border-radius:3px}
.node{width:12px;height:12px;border-radius:50%;border:2px solid #fff;display:inline-block}

/* Подпись ТП при наведении/выборе */
.tp-label{
  background:rgba(20,24,28,.9)!important;color:#fff!important;border:1px solid #58636e!important;
  box-shadow:none!important;font-size:10px;font-weight:700;padding:2px 4px!important
}
.tp-label:before{display:none}

/* Мобильная адаптация */
@media(max-width:900px){
  .sidebar{width:350px}
  .topbar{right:365px}
  .focus-note{right:365px}
}
@media(max-width:650px){
  .sidebar{width:100%;height:48%;top:auto;bottom:0;border-left:0;border-top:1px solid var(--border)}
  .topbar{right:10px}
  .topbar .status{display:none}
  .search{width:280px}
  .focus-note{right:10px;top:140px}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand">ЭНЕРГОУЗЕЛ ШИЕЛИ / ДИСПЕТЧЕРСКАЯ ГИС</div>
  <div class="status"><span class="dot"></span> GeoJSON: data_synchronized.geojson</div>
</div>

<div class="search">
  <input id="searchInput" autocomplete="off" placeholder="Поиск ПС, РП, фидера, ТП или линии...">
  <div id="results" class="results"></div>
</div>

<div id="focusNote" class="focus-note"></div>

<aside class="sidebar">
  <div class="sidebar-head">
    <button class="close" id="closePanel" title="Сбросить выделение">×</button>
    <div class="kicker">Карточка объекта</div>
    <div class="title" id="objectTitle">Объект не выбран</div>
    <div class="subtitle" id="objectSubtitle">Кликните объект на карте</div>
  </div>
  <div class="sidebar-body">
    <div class="section">
      <h3>Параметры</h3>
      <table id="attrs"><tr><td>Состояние</td><td>Ожидание выбора</td></tr></table>
    </div>
    <div class="section">
      <h3>Внешние ссылки / документация</h3>
      <div id="links" class="link-list">
        <div style="color:#8f9aa5;font-size:12px">Нет выбранного объекта.</div>
      </div>
    </div>
  </div>
</aside>

<div class="legend">
  <div class="legend-title">КЛАСС НАПРЯЖЕНИЯ</div>
  <div class="legend-row"><span class="sw" style="background:#ff3b30;height:5px"></span>110 кВ</div>
  <div class="legend-row"><span class="sw" style="background:#ff9f43;height:4px"></span>35 кВ</div>
  <div class="legend-row"><span class="sw" style="background:#36a8ff;height:4px"></span>10(6) кВ</div>
  <div class="legend-row"><span class="sw" style="background:#b57cff;height:3px"></span>0,4 кВ</div>
  <div class="legend-row"><span class="node" style="background:#e34b4b"></span>ПС / РП</div>
  <div class="legend-row"><span class="node" style="background:#ffd34d"></span>ТП / КТП</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
"use strict";

/* ============================================================
   ИСТОЧНИК ДАННЫХ
   index.html и data_synchronized.geojson должны лежать
   в одном каталоге GitHub Pages.
   ============================================================ */
const DATA_URL = "./data_synchronized.geojson";
let DATA = [];

const objects = new Map();
const layers = new Map();
const children = new Map();
const feederNameIndex = new Map();
let selectedId = null;
let selectedTp04 = new Set();

/* ---------- Карта ---------- */
const map = L.map("map", {
  zoomControl:true,
  preferCanvas:true,
  renderer:L.canvas({padding:.5})
}).setView([44.18,66.73],13);

map.createPane("energy-lines-pane");
map.createPane("energy-line04-pane");
map.createPane("energy-nodes-pane");
map.createPane("energy-tp-pane");
map.createPane("energy-label-pane");

map.getPane("energy-lines-pane").style.zIndex=410;
map.getPane("energy-line04-pane").style.zIndex=405;
map.getPane("energy-nodes-pane").style.zIndex=620;
map.getPane("energy-tp-pane").style.zIndex=650;
map.getPane("energy-label-pane").style.zIndex=700;

/* ---------- Базовые карты ---------- */
const osm=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:20,attribution:"© OpenStreetMap contributors"
});
const carto=L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  maxZoom:20,attribution:"© OpenStreetMap © CARTO"
});
const esri=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:20,attribution:"Tiles © Esri"}
);
const labels=L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
  {maxZoom:20,attribution:"© CARTO"}
);

osm.addTo(map);

/*
  ВАЖНО:
  Control.Layers теперь слева — под строкой поиска,
  а не справа поверх панели объекта.
*/
L.control.layers({
  "Стандартная схема":osm,
  "Спутник":esri,
  "Гибрид: спутник + подписи":L.layerGroup([esri,labels]),
  "Светлая схема":carto
},null,{
  collapsed:false,
  position:"topleft"
}).addTo(map);

/* ---------- Стили ---------- */
function voltageText(o){
  return String(o.voltage||"").replace(",",".").toLowerCase();
}

function is04(o){
  return o.type==="line04" ||
         o.type==="input04" ||
         /(^|[^0-9])0\.4\s*кв/.test(voltageText(o));
}

function isTP(o){
  return o.type==="tp" ||
         /(?:^|\s)(?:ктп|ктпн|тп|ктпб)(?:\s|-)/i.test(String(o.name||""));
}

function isSubstation(o){
  return o.type==="substation";
}

function isRP(o){
  return o.type==="rp";
}

function is10Line(o){
  return o.type==="feeder" ||
         o.type==="line10" ||
         (o.type==="line" && /10\s*кв/i.test(String(o.voltage||"")));
}

function styleFor(o){
  if(isSubstation(o)) return {color:"#ff3b30",fillColor:"#e34b4b",radius:11,weight:3};
  if(isRP(o)) return {color:"#ff7b45",fillColor:"#ff7b45",radius:9,weight:3};
  if(isTP(o)) return {color:"#ffd34d",fillColor:"#ffd34d",radius:8,weight:2};
  if(is04(o)) return {color:"#b57cff",weight:3,opacity:.95,dashArray:"6 5"};
  if(is10Line(o)) return {color:"#36a8ff",weight:5,opacity:.95};
  if(o.type==="line") return {color:"#36a8ff",weight:4,opacity:.9};
  return {color:"#aab4be",fillColor:"#aab4be",radius:5,weight:1};
}

/* ---------- Безопасный текст ---------- */
function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function escAttr(v){return esc(v)}

/* ---------- Загрузка GeoJSON ---------- */
async function loadData(){
  try{
    const response=await fetch(DATA_URL,{cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}: ${DATA_URL}`);
    const geojson=await response.json();

    if(!geojson || geojson.type!=="FeatureCollection" || !Array.isArray(geojson.features)){
      throw new Error("Файл не является корректным GeoJSON FeatureCollection.");
    }

    DATA=geojson.features.map((f,i)=>{
      const p=f.properties||{};
      return {
        ...p,
        id:p.id || `geo_${String(i).padStart(4,"0")}`,
        name:p.name || `Объект ${i+1}`,
        type:p.object_type || geometryTypeToObjectType(f.geometry),
        geometry:f.geometry
      };
    });

    buildIndexes();
    drawAll();
    updateStatus(`Загружено объектов: ${DATA.length}`);
  }catch(error){
    console.error(error);
    updateStatus("Ошибка загрузки GeoJSON");
    document.getElementById("objectTitle").textContent="Ошибка загрузки данных";
    document.getElementById("objectSubtitle").textContent=error.message;
  }
}

function geometryTypeToObjectType(g){
  if(!g)return "point";
  if(g.type==="Point")return "point";
  if(g.type==="LineString" || g.type==="MultiLineString")return "line";
  if(g.type==="Polygon" || g.type==="MultiPolygon")return "polygon";
  return "object";
}

function buildIndexes(){
  objects.clear();
  children.clear();
  feederNameIndex.clear();

  DATA.forEach(o=>{
    objects.set(o.id,o);
    const name=norm(o.name);
    if(name) feederNameIndex.set(name,o.id);
  });

  /*
    parent_id используется в первую очередь.
    Если parent_id отсутствует, пытаемся связать объект
    с фидером по fed_from — без изменения исходных данных.
  */
  DATA.forEach(o=>{
    let parent=o.parent_id ? objects.get(o.parent_id) : null;

    if(!parent && o.fed_from){
      const target=norm(o.fed_from);
      for(const candidate of DATA){
        if(candidate.id===o.id)continue;
        if(candidate.type==="feeder" || is10Line(candidate)){
          const cn=norm(candidate.name);
          if(cn===target || cn.includes(target) || target.includes(cn)){
            parent=candidate;
            break;
          }
        }
      }
    }

    if(parent){
      if(!o._resolved_parent_id) o._resolved_parent_id=parent.id;
      if(!children.has(parent.id)) children.set(parent.id,new Set());
      children.get(parent.id).add(o.id);
    }
  });
}

function norm(v){
  return String(v??"")
    .replace(/\u00a0/g," ")
    .replace(/["«»]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}

/* ---------- Рендеринг ---------- */
function drawAll(){
  const bounds=[];

  DATA.forEach(o=>{
    const layer=createLayer(o);
    if(!layer)return;
    layers.set(o.id,layer);

    if(is04(o)){
      // Все 0,4 кВ скрыты до выбора конкретной ТП.
      return;
    }

    layer.addTo(map);

    if(o.geometry){
      try{
        const b=layer.getBounds ? layer.getBounds() :
          (o.geometry.type==="Point"
            ? L.latLngBounds([[o.geometry.coordinates[1],o.geometry.coordinates[0]]])
            : null);
        if(b && b.isValid())bounds.push(b);
      }catch(e){}
    }
  });

  refreshAll();

  // Не уводим пользователя слишком далеко: стартуем на районе Шиели.
  if(bounds.length){
    const group=L.featureGroup(bounds.map(b=>L.rectangle(b,{opacity:0,fillOpacity:0})));
    // Фактический вид фиксируем на Шиели, а не по всему району.
    map.setView([44.18,66.73],13);
  }
}

function createLayer(o){
  if(!o.geometry)return null;
  const g=o.geometry;
  const s=styleFor(o);

  if(g.type==="Point"){
    const pane=isTP(o)?"energy-tp-pane":"energy-nodes-pane";
    const marker=L.circleMarker(
      [g.coordinates[1],g.coordinates[0]],
      {
        pane:pane,
        radius:s.radius||5,
        color:s.color,
        fillColor:s.fillColor||s.color,
        fillOpacity:1,
        opacity:1,
        weight:s.weight||1
      }
    );

    marker.on("mouseover",()=>{
      marker.setStyle({
        radius:(s.radius||5)+3,
        weight:(s.weight||1)+1,
        fillOpacity:1,
        opacity:1
      });
      if(isTP(o)){
        marker.bindTooltip(o.name,{
          permanent:false,
          direction:"top",
          className:"tp-label",
          offset:[0,-6]
        }).openTooltip();
      }
    });

    marker.on("mouseout",()=>{
      marker.closeTooltip();
      refreshObjectStyle(o.id);
    });

    marker.on("click",e=>{
      L.DomEvent.stopPropagation(e);
      selectObject(o.id);
    });

    // ТП всегда имеют понятную подпись при наведении.
    if(isTP(o)){
      marker.bindTooltip(o.name,{
        direction:"top",
        className:"tp-label",
        offset:[0,-6]
      });
    }else{
      marker.bindTooltip(o.name,{sticky:true,opacity:.95});
    }

    return marker;
  }

  const pane=is04(o)?"energy-line04-pane":"energy-lines-pane";
  const line=L.geoJSON(g,{
    pane:pane,
    style:()=>({
      color:s.color,
      weight:s.weight||3,
      opacity:s.opacity??.95,
      dashArray:s.dashArray||null,
      lineCap:"round",
      lineJoin:"round"
    })
  });

  line.on("mouseover",()=>line.setStyle({
    weight:(s.weight||3)+3,
    opacity:1
  }));

  line.on("mouseout",()=>refreshObjectStyle(o.id));

  line.on("click",e=>{
    L.DomEvent.stopPropagation(e);
    selectObject(o.id);
  });

  line.bindTooltip(o.name,{sticky:true,opacity:.95});
  return line;
}

/* ---------- Иерархия ---------- */
function getParentId(o){
  if(o.parent_id && objects.has(o.parent_id))return o.parent_id;
  if(o._resolved_parent_id)return o._resolved_parent_id;
  return null;
}

function descendants(id){
  const result=new Set([id]);
  const walk=parent=>{
    const ch=children.get(parent);
    if(!ch)return;
    ch.forEach(id2=>{
      if(!result.has(id2)){
        result.add(id2);
        walk(id2);
      }
    });
  };
  walk(id);
  return result;
}

function ancestors(id){
  const result=new Set();
  let current=objects.get(id);
  const guard=new Set();

  while(current && !guard.has(current.id)){
    guard.add(current.id);
    result.add(current.id);
    const pid=getParentId(current);
    current=pid?objects.get(pid):null;
  }
  return result;
}

function relatedForSelection(id){
  const o=objects.get(id);
  const result=new Set();
  if(!o)return result;

  if(isSubstation(o) || isRP(o)){
    descendants(id).forEach(x=>result.add(x));
  }else if(is10Line(o)){
    result.add(o.id);
    descendants(o.id).forEach(x=>result.add(x));
    ancestors(o.id).forEach(x=>result.add(x));
  }else if(isTP(o)){
    result.add(o.id);
    ancestors(o.id).forEach(x=>result.add(x));
    (children.get(o.id)||[]).forEach(x=>result.add(x));
  }else{
    result.add(o.id);
    ancestors(o.id).forEach(x=>result.add(x));
  }

  return result;
}

/* ---------- Видимость и стили ---------- */
function refreshObjectStyle(id){
  const o=objects.get(id);
  const layer=layers.get(id);
  if(!o || !layer)return;

  const s=styleFor(o);
  const related=selectedId?relatedForSelection(selectedId):null;
  const active=!selectedId || related.has(id);
  const opacity=active?1:.25;

  if(layer.setStyle){
    layer.setStyle({
      opacity:opacity,
      fillOpacity:opacity,
      weight:(s.weight||2)+(selectedId&&active?1:0)
    });
  }
}

function refreshAll(){
  const related=selectedId?relatedForSelection(selectedId):null;

  DATA.forEach(o=>{
    const layer=layers.get(o.id);
    if(!layer)return;

    if(is04(o)){
      /*
        Показываем только 0,4 кВ, которые явно относятся
        к выбранной ТП через parent_id или resolved parent.
      */
      const parent=getParentId(o);
      const visible=!!selectedId && isTP(objects.get(selectedId)||{}) &&
                    parent===selectedId;

      if(visible){
        if(!map.hasLayer(layer))layer.addTo(map);
      }else{
        if(map.hasLayer(layer))map.removeLayer(layer);
      }
    }

    const s=styleFor(o);
    const active=!selectedId || related.has(o.id);
    const opacity=active?1:.25;

    if(layer.setStyle){
      layer.setStyle({
        opacity:opacity,
        fillOpacity:opacity,
        weight:(s.weight||2)+(selectedId&&active?1:0)
      });
    }
  });
}

/* ---------- Выбор объекта ---------- */
function selectObject(id){
  const o=objects.get(id);
  if(!o)return;

  selectedId=id;
  selectedTp04.clear();

  if(isTP(o)){
    selectedTp04.add(o.id);

    // Дополнительно ищем 0,4 кВ по имени в описании,
    // только если parent_id отсутствует.
    DATA.forEach(x=>{
      if(!is04(x))return;
      const p=getParentId(x);
      if(p===o.id)selectedTp04.add(o.id);
    });
  }

  refreshAll();
  showCard(o);

  document.getElementById("focusNote").style.display="block";
  document.getElementById("focusNote").textContent="ФОКУС: "+o.name;

  const layer=layers.get(id);
  if(layer){
    try{
      if(o.geometry.type==="Point"){
        map.setView(
          [o.geometry.coordinates[1],o.geometry.coordinates[0]],
          Math.max(map.getZoom(),16),
          {animate:true}
        );
      }else{
        const b=layer.getBounds();
        if(b && b.isValid())map.fitBounds(b.pad(.6),{maxZoom:16});
      }
    }catch(e){}
  }
}

function resetSelection(){
  selectedId=null;
  selectedTp04.clear();
  refreshAll();
  clearCard();
  document.getElementById("focusNote").style.display="none";
}

map.on("click",e=>{
  // Клик именно по пустой карте сбрасывает выбор.
  resetSelection();
});

document.getElementById("closePanel").onclick=resetSelection;

/* ---------- Карточка ---------- */
function showCard(o){
  document.getElementById("objectTitle").textContent=o.name;
  document.getElementById("objectSubtitle").textContent=
    isSubstation(o)?"ПОДСТАНЦИЯ":
    isRP(o)?"РАСПРЕДЕЛИТЕЛЬНЫЙ ПУНКТ":
    isTP(o)?"ТРАНСФОРМАТОРНЫЙ ПУНКТ":
    is10Line(o)?"ЛИНИЯ 10(6) КВ":
    is04(o)?"ЛИНИЯ 0,4 КВ":"ОБЪЕКТ ЭНЕРГОСЕТИ";

  const parentId=getParentId(o);
  const parent=parentId?objects.get(parentId):null;

  const rows=[
    ["ID",o.id],
    ["Тип объекта",o.object_type||o.type||"—"],
    ["Напряжение",o.voltage||"—"],
    ["Год ввода",o.year||"—"],
    ["Балансовая принадлежность",o.balance||"—"],
    ["Марка провода/кабеля",o.wire||"—"],
    ["Запитано от",parent?parent.name:(o.fed_from||"—")],
    ["Родительский объект",parent?parent.name:(o.parent_id||"—")],
    ["Установленная мощность",o.power_kva||o.power||"—"],
    ["Зав./Инв. №",o.inventory_no||"—"],
    ["Протяженность",o.length!=null?o.length:"—"],
    ["Описание",o.description||"—"]
  ];

  document.getElementById("attrs").innerHTML=rows.map(r=>
    `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`
  ).join("");

  const links=Array.isArray(o.links)?o.links:[];
  const validLinks=links.map(x=>{
    if(Array.isArray(x))return {name:x[0],url:x[1]};
    return {name:x.name||x.title||"Внешняя ссылка",url:x.url||x.href||""};
  }).filter(x=>x.url);

  document.getElementById("links").innerHTML=validLinks.length
    ?validLinks.map(x=>
      `<a class="link-btn" href="${escAttr(x.url)}" target="_blank" rel="noopener noreferrer">
        <span>↗</span>${esc(x.name)}
      </a>`
    ).join("")
    :'<div style="color:#8f9aa5;font-size:12px">Внешние ссылки не заданы.</div>';
}

function clearCard(){
  document.getElementById("objectTitle").textContent="Объект не выбран";
  document.getElementById("objectSubtitle").textContent="Кликните объект на карте";
  document.getElementById("attrs").innerHTML=
    '<tr><td>Состояние</td><td>Ожидание выбора</td></tr>';
  document.getElementById("links").innerHTML=
    '<div style="color:#8f9aa5;font-size:12px">Нет выбранного объекта.</div>';
}

/* ---------- Поиск ---------- */
const searchInput=document.getElementById("searchInput");
const results=document.getElementById("results");

searchInput.addEventListener("input",()=>{
  const q=norm(searchInput.value);
  if(!q){
    results.innerHTML="";
    return;
  }

  const arr=DATA.filter(o=>[
    o.name,o.id,o.object_type,o.type,o.voltage,o.wire,o.fed_from,
    o.parent_id,o.balance,o.power_kva,o.inventory_no,o.description
  ].join(" ").toLowerCase().includes(q)).slice(0,20);

  results.innerHTML=arr.length
    ?arr.map(o=>
      `<div class="result" data-id="${escAttr(o.id)}">
        ${esc(o.name)}
        <small> · ${esc(o.voltage||o.object_type||o.type||"")}</small>
      </div>`
    ).join("")
    :'<div style="padding:8px;color:#89939d;font-size:12px">Ничего не найдено</div>';

  results.querySelectorAll(".result").forEach(el=>{
    el.onclick=()=>{
      selectObject(el.dataset.id);
      results.innerHTML="";
      searchInput.value="";
    };
  });
});

function updateStatus(text){
  const el=document.querySelector(".status");
  if(el)el.innerHTML=`<span class="dot"></span> ${esc(text)}`;
}

/* ---------- Запуск ---------- */
loadData();
</script>
